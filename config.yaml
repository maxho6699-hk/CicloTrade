# QUANT V5.1 CicloTrade 本地配置。真实凭证只允许通过 .env 注入。
app:
  name: CicloTrade
  version: QUANT V5.1
  timezone: Asia/Hong_Kong
  language: zh-Hant
  mode: production-research
sandbox: false
plans:

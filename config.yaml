  max_total_position: 50000
  max_daily_loss: 2000
  max_position_per_symbol_cny: 35000
  max_total_position_cny: 350000
  max_daily_loss_cny: 14000
  cooldown_minutes: 30
  consecutive_loss_limit: 3
  max_retries: 2
  market_timezone: America/New_York
strategy_weights:
  return: 0.35
  drawdown: 0.25
  ratio: 0.25
  loss: 0.15
telegram:
  token_env: TELEGRAM_BOT_TOKEN
  enabled_env: EXTERNAL_ALERTS_ENABLED
  community_url: "https://t.me/+iHJKJePgc8hiZjFl"
  groups:
    daily: "-1003794694425"
    advanced: "-1004460522940"
    professional: "-1003902118990"
  events:
    order_submitted: true
    order_filled: true
    risk_rejected: true
    force_liquidation: true
    system_exception: true

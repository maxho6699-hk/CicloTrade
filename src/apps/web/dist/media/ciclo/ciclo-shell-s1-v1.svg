<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo 标准外观</title>
  <desc id="desc">带肩部数据模块、青蓝环形状态轨与增强胸前核心的 Ciclo 助手。</desc>
  <defs>
    <linearGradient id="shell" x1="65" y1="38" x2="250" y2="283" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset=".45" stop-color="#e0e9f6"/><stop offset="1" stop-color="#8ea4c1"/></linearGradient>
    <linearGradient id="edge" x1="84" y1="54" x2="236" y2="265" gradientUnits="userSpaceOnUse"><stop stop-color="#7eeeff"/><stop offset="1" stop-color="#5267ff"/></linearGradient>

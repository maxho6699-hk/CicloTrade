    <radialGradient id="core"><stop stop-color="#f3feff"/><stop offset=".28" stop-color="#63e8ff"/><stop offset="1" stop-color="#5461ff"/></radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="210%"><feDropShadow dx="0" dy="17" stdDeviation="14" flood-color="#1a2e66" flood-opacity=".3"/></filter>
